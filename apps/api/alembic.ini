# Alembic configuration, for writing migrations. Run from apps/api:
#
#   uv run alembic upgrade head                    apply all migrations
#   uv run alembic revision --autogenerate --rev-id 0002 -m "…"   draft one from the models
#
# The migrations live inside the package (src/paritylens_api/migrations) so
# that they ship with it; a deployment applies them with
# `python -m paritylens_api.migrate` and needs neither this file nor the
# source tree.
#
# The database URL comes from PARITYLENS_DATABASE_URL (see migrations/env.py),
# not from this file, so no credentials live here.

[alembic]
script_location = paritylens_api:migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
