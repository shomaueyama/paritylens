[project]
name = "paritylens-api"
version = "0.1.0"
description = "ParityLens HTTP API and worker."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "cryptography>=44",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "httpx2>=2.13",
    "paritylens-engine",
    "pydantic-settings>=2.7",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paritylens_api"]

[tool.uv.sources]
paritylens-engine = { workspace = true }
