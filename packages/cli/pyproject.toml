[project]
name = "paritylens-cli"
version = "0.1.0"
description = "The paritylens command: run a comparison suite from a terminal or CI."
requires-python = ">=3.13"
dependencies = [
    "paritylens-engine",
    "pyyaml>=6.0",
    "rich>=13.9",
    "typer>=0.15",
]

[project.scripts]
paritylens = "paritylens_cli.main:app"

[tool.uv.sources]
paritylens-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paritylens_cli"]
