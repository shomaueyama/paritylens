[project]
name = "paritylens-engine"
version = "0.1.0"
description = "ParityLens comparison engine: normalization, deterministic diff, severity."
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.10",
    "httpx2>=2.13",
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paritylens_engine"]
