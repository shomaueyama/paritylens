[project]
name = "modern-shop-api"
version = "0.1.0"
description = "The rewritten side of the demo, with behaviour differences planted on purpose."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modern_shop_api"]
