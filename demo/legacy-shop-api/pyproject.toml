[project]
name = "legacy-shop-api"
version = "0.1.0"
description = "The legacy side of the demo: a hand-rolled order API."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legacy_shop_api"]
